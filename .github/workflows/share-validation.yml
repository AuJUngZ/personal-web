name: Share change validation
on:
  push:
    branches: [fix/blog-native-share]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint
      - name: Build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Check results
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test "$LINT_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
